<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PDF Toolbox{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version }}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">📄 PDF <span>Toolbox</span></a>
        {% block navbar %}{% endblock %}
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/main.js?v={{ asset_version }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
