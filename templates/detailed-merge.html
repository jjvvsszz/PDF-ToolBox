{% extends "base.html" %}
{% block title %}Mesclagem Visual - PDF Toolbox{% endblock %}

{% block content %}
<div class="page-header">
    <h1>🎨 Mesclagem Visual</h1>
    <p>Adicione PDFs, visualize miniaturas de cada página, reorganize a ordem e exclua páginas antes de gerar o PDF final.</p>
</div>

<div class="toolbar">
    <button class="btn btn-secondary" id="add-btn">+ Adicionar PDFs</button>
    <input type="file" id="file-input" accept=".pdf" multiple hidden>
    <button class="btn btn-secondary" id="clear-btn" onclick="clearAll()">Limpar Tudo</button>
    <button class="btn btn-primary" id="save-btn" onclick="savePdf()">💾 Salvar PDF Final</button>
</div>

<div id="thumb-grid" class="thumb-grid"></div>

<div class="progress-bar" id="progress-bar">
    <div class="progress-fill"></div>
</div>
<div class="status-message" id="status-message"></div>
{% endblock %}

{% block scripts %}
<script>
let sessionId = null;
const statusEl = document.getElementById("status-message");

function showStatus(kind, text) {
    statusEl.className = "status-message " + kind;
    statusEl.textContent = text;
    statusEl.style.display = "block";
}

async function initSession() {
    const resp = await fetch("/api/detailed-merge/create-session", { method: "POST" });
    if (!resp.ok) throw new Error(await readError(resp));
    sessionId = (await resp.json()).session_id;
}

const sessionReady = initSession().catch(e => showStatus("error", "Erro: " + e.message));

// Envia para a API; se a sessao expirou, cria outra e avisa o usuario.
async function sessionPost(url, buildForm) {
    await sessionReady;
    if (!sessionId) await initSession();
    let resp = await fetch(url, { method: "POST", body: buildForm() });
    if (resp.status === 404 && resp.headers.get("X-Session-Expired")) {
        const message = await readError(resp);
        await initSession();
        renderThumbnails([]);
        throw new Error(message);
    }
    if (!resp.ok) throw new Error(await readError(resp));
    return resp;
}

function formWith(fields) {
    const fd = new FormData();
    fd.append("session_id", sessionId);
    for (const [k, v] of Object.entries(fields)) fd.append(k, v);
    return fd;
}

document.getElementById("add-btn").addEventListener("click", () => {
    document.getElementById("file-input").click();
});

document.getElementById("file-input").addEventListener("change", async () => {
    const input = document.getElementById("file-input");
    const files = Array.from(input.files);
    input.value = "";
    if (!files.length) return;

    showStatus("info", "Adicionando páginas...");
    try {
        const resp = await sessionPost("/api/detailed-merge/add-pdf", () => {
            const fd = formWith({});
            for (const f of files) fd.append("files", f);
            return fd;
        });
        const data = await resp.json();
        renderThumbnails(data.pages);
        const problems = (data.errors || []).join(" ");
        if (data.total_added > 0) {
            showStatus(problems ? "info" : "success",
                `${data.total_added} páginas adicionadas (total: ${data.total_pages}). ${problems}`.trim());
        } else {
            showStatus("error", problems || "Nenhuma página adicionada");
        }
    } catch (e) {
        showStatus("error", "Erro: " + e.message);
    }
});

function renderThumbnails(pages) {
    const grid = document.getElementById("thumb-grid");
    grid.innerHTML = "";
    pages.forEach((page, i) => {
        const card = document.createElement("div");
        card.className = "thumb-card";
        card.innerHTML = `
            <img src="/api/detailed-merge/thumbnail/${sessionId}/${encodeURIComponent(page.thumbnail)}" alt="Página ${i + 1}" loading="lazy">
            <div class="page-label">Pág ${i + 1} · ${escapeHtml(page.original_filename)}</div>
            <div class="thumb-actions">
                <button class="thumb-btn" onclick="movePage(${i}, 'up')" ${i === 0 ? "disabled" : ""}>▲</button>
                <button class="thumb-btn" onclick="movePage(${i}, 'down')" ${i === pages.length - 1 ? "disabled" : ""}>▼</button>
                <button class="thumb-btn delete" onclick="deletePage(${i})">✕</button>
            </div>
        `;
        grid.appendChild(card);
    });

    if (pages.length === 0) {
        grid.innerHTML = '<p style="color:#8892b0;text-align:center;padding:2rem;">Nenhuma página adicionada. Clique em "+ Adicionar PDFs" para começar.</p>';
    }
}

async function pageAction(url, fields) {
    try {
        const resp = await sessionPost(url, () => formWith(fields));
        const data = await resp.json();
        if (data.success) renderThumbnails(data.pages);
    } catch (e) {
        showStatus("error", "Erro: " + e.message);
    }
}

function movePage(index, direction) {
    return pageAction("/api/detailed-merge/reorder", { index, direction });
}

function deletePage(index) {
    return pageAction("/api/detailed-merge/delete", { index });
}

function clearAll() {
    return pageAction("/api/detailed-merge/clear", {});
}

async function savePdf() {
    showStatus("info", "Gerando PDF...");
    try {
        const resp = await sessionPost("/api/detailed-merge/save", () => formWith({}));
        const blob = await resp.blob();
        downloadBlob(blob, "detailed_merged.pdf");
        showStatus("success", "PDF salvo com sucesso!");
    } catch (e) {
        showStatus("error", "Erro: " + e.message);
    }
}
</script>
{% endblock %}
