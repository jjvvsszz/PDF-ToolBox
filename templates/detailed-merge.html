{% extends "base.html" %}
{% block title %}Mesclagem Visual - PDF Toolbox{% endblock %}

{% block content %}
<div class="page-header">
    <h1>🎨 Mesclagem Visual</h1>
    <p>Adicione PDFs, visualize miniaturas de cada página, reorganize a ordem e exclua páginas antes de gerar o PDF final.</p>
</div>

<div class="toolbar">
    <button class="btn btn-secondary" id="add-btn">+ Adicionar PDFs</button>
    <input type="file" id="file-input" accept=".pdf" multiple hidden>
    <button class="btn btn-secondary" id="clear-btn" onclick="clearAll()">Limpar Tudo</button>
    <button class="btn btn-primary" id="save-btn" onclick="savePdf()">💾 Salvar PDF Final</button>
</div>

<div id="thumb-grid" class="thumb-grid"></div>

<div class="progress-bar" id="progress-bar">
    <div class="progress-fill"></div>
</div>
<div class="status-message" id="status-message"></div>
{% endblock %}

{% block scripts %}
<script>
let sessionId = null;

async function initSession() {
    const resp = await fetch("/api/detailed-merge/create-session", { method: "POST" });
    const data = await resp.json();
    sessionId = data.session_id;
}

initSession();

document.getElementById("add-btn").addEventListener("click", () => {
    document.getElementById("file-input").click();
});

document.getElementById("file-input").addEventListener("change", async () => {
    const files = document.getElementById("file-input").files;
    if (!files.length) return;
    document.getElementById("file-input").value = "";

    const fd = new FormData();
    fd.append("session_id", sessionId);
    for (const f of files) {
        fd.append("files", f);
    }

    const status = document.getElementById("status-message");
    status.className = "status-message info";
    status.textContent = "Adicionando páginas...";
    status.style.display = "block";

    try {
        const resp = await fetch("/api/detailed-merge/add-pdf", { method: "POST", body: fd });
        const data = await resp.json();
        if (data.total_added > 0) {
            status.className = "status-message success";
            status.textContent = `${data.total_added} páginas adicionadas (total: ${data.total_pages})`;
            renderThumbnails(data.pages);
        } else {
            status.className = "status-message error";
            status.textContent = "Nenhuma página adicionada";
        }
    } catch (e) {
        status.className = "status-message error";
        status.textContent = "Erro: " + e.message;
    }
    status.style.display = "block";
});

function renderThumbnails(pages) {
    const grid = document.getElementById("thumb-grid");
    grid.innerHTML = "";
    pages.forEach((page, i) => {
        const card = document.createElement("div");
        card.className = "thumb-card";
        card.innerHTML = `
            <img src="/api/detailed-merge/thumbnail/${sessionId}/${page.thumbnail}" alt="Página ${i + 1}" loading="lazy">
            <div class="page-label">Pág ${i + 1} · ${page.original_filename}</div>
            <div class="thumb-actions">
                <button class="thumb-btn" onclick="movePage(${i}, 'up')" ${i === 0 ? "disabled" : ""}>▲</button>
                <button class="thumb-btn" onclick="movePage(${i}, 'down')" ${i === pages.length - 1 ? "disabled" : ""}>▼</button>
                <button class="thumb-btn delete" onclick="deletePage(${i})">✕</button>
            </div>
        `;
        grid.appendChild(card);
    });

    if (pages.length === 0) {
        grid.innerHTML = '<p style="color:#8892b0;text-align:center;padding:2rem;">Nenhuma página adicionada. Clique em "+ Adicionar PDFs" para começar.</p>';
    }
}

async function movePage(index, direction) {
    const fd = new FormData();
    fd.append("session_id", sessionId);
    fd.append("index", index);
    fd.append("direction", direction);

    const resp = await fetch("/api/detailed-merge/reorder", { method: "POST", body: fd });
    const data = await resp.json();
    if (data.success) {
        renderThumbnails(data.pages);
    }
}

async function deletePage(index) {
    const fd = new FormData();
    fd.append("session_id", sessionId);
    fd.append("index", index);

    const resp = await fetch("/api/detailed-merge/delete", { method: "POST", body: fd });
    const data = await resp.json();
    if (data.success) {
        renderThumbnails(data.pages);
    }
}

async function clearAll() {
    const fd = new FormData();
    fd.append("session_id", sessionId);
    const resp = await fetch("/api/detailed-merge/clear", { method: "POST", body: fd });
    const data = await resp.json();
    if (data.success) {
        renderThumbnails(data.pages);
    }
}

async function savePdf() {
    const status = document.getElementById("status-message");
    status.className = "status-message info";
    status.textContent = "Gerando PDF...";
    status.style.display = "block";

    const fd = new FormData();
    fd.append("session_id", sessionId);

    try {
        const resp = await fetch("/api/detailed-merge/save", { method: "POST", body: fd });
        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.error || "Erro");
        }
        const blob = await resp.blob();
        downloadBlob(blob, "detailed_merged.pdf");
        status.className = "status-message success";
        status.textContent = "PDF salvo com sucesso!";
    } catch (e) {
        status.className = "status-message error";
        status.textContent = "Erro: " + e.message;
    }
    status.style.display = "block";
}
</script>
{% endblock %}
